spring.application.name=tool_calling

#The JDBC URL fomat is: jdbc:postgressql://<host>:<port>/<database_name>
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=postgres
spring.datasource.password=123

# Spring Boot auto-detects the driver, but you can explicitly define it:
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.ai.google.genai.api-key=

spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.chat.temperature=0.2
